<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Gallery · show-anywhere-mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@1,400;1,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600__CARD_FONTS_QUERY__&display=swap" rel="stylesheet">

<style>
/* ===========================================
   TOKENS
   =========================================== */
:root{
  --bg:#EAE6DA;
  --surface:#F7F4EC;
  --surface-2:#F1EDE0;
  --ink:#1C1B17;
  --muted:#726C5E;
  --line:#D8D1BE;
  --accent:#2F3B7A;
  --accent-soft:rgba(47,59,122,0.10);
  --shadow: 0 1px 2px rgba(28,27,23,0.05), 0 8px 20px rgba(28,27,23,0.06);
  --radius:14px;
  --font-display:'Spectral', Georgia, serif;
  --font-body:'Work Sans', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
:root[data-theme="dark"]{
  --bg:#17160F;
  --surface:#211F17;
  --surface-2:#28251A;
  --ink:#F1EDE2;
  --muted:#A69F8C;
  --line:#3A3627;
  --accent:#9CA8FF;
  --accent-soft:rgba(156,168,255,0.14);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17160F;
    --surface:#211F17;
    --surface-2:#28251A;
    --ink:#F1EDE2;
    --muted:#A69F8C;
    --line:#3A3627;
    --accent:#9CA8FF;
    --accent-soft:rgba(156,168,255,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}

/* ===========================================
   SHELL / MASTHEAD
   =========================================== */
.shell{max-width:1320px;margin:0 auto;padding:56px 32px 100px;}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px;}
.masthead h1{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:44px;margin:0 0 8px;letter-spacing:-0.01em;}
.masthead p{margin:0;color:var(--muted);font-size:15px;max-width:560px;line-height:1.55;}
.masthead .count{font-family:var(--font-mono);font-size:13px;color:var(--muted);letter-spacing:0.04em;white-space:nowrap;}
.masthead .count b{color:var(--ink);font-weight:600;}

/* ===========================================
   CONTROLS
   =========================================== */
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 16px;margin-bottom:8px;border-bottom:1px solid var(--line);}
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.search-row input{
  flex:1;font-family:var(--font-body);font-size:15px;padding:11px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none;
}
.search-row input::placeholder{color:var(--muted);}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.kind-toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0;}
.kind-toggle button{
  font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;padding:11px 14px;background:var(--surface);
  color:var(--muted);border:none;cursor:pointer;border-right:1px solid var(--line);
}
.kind-toggle button:last-child{border-right:none;}
.kind-toggle button.active{background:var(--accent);color:var(--surface);}

.kind-note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.6;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  font-family:var(--font-mono);font-size:12px;letter-spacing:0.03em;padding:6px 12px;border-radius:100px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;user-select:none;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.chip:hover{border-color:var(--accent);color:var(--ink);}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--surface);}

/* ===========================================
   GRID + CARDS
   =========================================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:20px;margin-top:28px;}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
  outline:2px solid transparent;outline-offset:-2px;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);}
.card:focus-visible{outline-color:var(--accent);}
.card.selected{outline-color:var(--accent);}
.card .plate{
  position:relative;padding:26px 20px 20px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;
}
.card .plate .name{font-size:26px;line-height:1.1;letter-spacing:-0.01em;word-break:break-word;}
.card .plate .kind-badge{
  position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;
  padding:3px 7px;border-radius:100px;text-transform:uppercase;
}
.card .swatches{display:flex;height:8px;}
.card .swatches span{flex:1;display:block;}
.card .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.card .tagline{font-size:13px;line-height:1.55;color:var(--muted);margin:0;min-height:40px;}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;}
.card .pill{
  font-family:var(--font-mono);font-size:10px;letter-spacing:0.03em;padding:3px 8px;border-radius:100px;
  background:var(--surface-2);color:var(--muted);text-transform:lowercase;
}
.card .check{
  position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);
  color:var(--surface);display:none;align-items:center;justify-content:center;font-size:13px;
}
.card.selected .check{display:flex;}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--font-mono);font-size:13px;}

/* ===========================================
   SELECTION BAR
   =========================================== */
.selbar{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%, 120%);
  background:var(--ink);color:var(--bg);border-radius:100px;padding:12px 12px 12px 22px;
  display:flex;align-items:center;gap:16px;box-shadow:0 12px 32px rgba(0,0,0,0.28);
  transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:20;max-width:calc(100vw - 40px);
}
.selbar.show{transform:translate(-50%, 0);}
.selbar .label{font-family:var(--font-body);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.selbar .label b{font-weight:600;}
.selbar .selname-input{
  font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--bg);background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);border-radius:100px;padding:8px 14px;width:min(46vw,220px);
  outline:none;cursor:text;
}
.selbar .selname-input:focus{border-color:rgba(255,255,255,0.4);}
.selbar button{
  font-family:var(--font-mono);font-size:12px;letter-spacing:0.03em;background:var(--bg);color:var(--ink);
  border:none;border-radius:100px;padding:9px 16px;cursor:pointer;white-space:nowrap;
}
.selbar .dismiss{background:transparent;color:var(--bg);opacity:0.6;padding:9px 10px;}

@media (prefers-reduced-motion: reduce){
  .card, .selbar, .chip{transition:none;}
}

@media (max-width:640px){
  .shell{padding:32px 18px 90px;}
  .masthead h1{font-size:32px;}
  .grid{grid-template-columns:1fr 1fr;gap:12px;}
  .card .plate{min-height:84px;padding:20px 14px 14px;}
  .card .plate .name{font-size:20px;}
}
</style>

<div class="shell">
  <div class="masthead">
    <div>
      <h1>Style Gallery</h1>
      <p id="introText"></p>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="kind-toggle" id="langToggle" aria-label="Language / 语言">
        <button data-lang="en">EN</button>
        <button data-lang="zh">中文</button>
      </div>
      <div class="count"><b id="countNum">0</b> / <span id="totalNum">0</span> <span id="countUnit"></span></div>
    </div>
  </div>

  <div class="controls">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="" />
      <div class="kind-toggle" id="kindToggle">
        <button data-kind="all" class="active"></button>
        <button data-kind="preset"></button>
        <button data-kind="bold"></button>
      </div>
    </div>
    <p class="kind-note" id="kindNote"></p>
    <div class="chip-row" id="chipRow"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="selbar" id="selbar">
  <span class="label" id="selLabel"></span>
  <input id="selNameInput" class="selname-input" type="text" readonly aria-label="Selected style name / 选中的风格名称" />
  <button id="copyBtn"></button>
  <button class="dismiss" id="dismissBtn">✕</button>
</div>

<script id="galleryData" type="application/json">
__DATA__
</script>

<script>
(function(){
  const data = JSON.parse(document.getElementById('galleryData').textContent);
  const grid = document.getElementById('grid');
  const chipRow = document.getElementById('chipRow');
  const searchInput = document.getElementById('searchInput');
  const kindToggle = document.getElementById('kindToggle');
  const countNum = document.getElementById('countNum');
  const totalNum = document.getElementById('totalNum');
  const selbar = document.getElementById('selbar');
  const selNameInput = document.getElementById('selNameInput');

  /* ===========================================
     I18N — every visible string the shell renders.
     Card taglines come bilingual from gallery-data.json
     (tagline / tagline_zh); mood, formality and scheme
     words are translated through the dictionaries below.
     Style names and font names are proper nouns and stay
     as-is in both languages.
     =========================================== */
  const I18N = {
    en: {
      intro: "A quick-look card for every available palette + typeface. This is not a layout preview — real typographic detail only shows up in the generated deck. Pick one you like and tell the assistant its name.",
      countUnit: "styles",
      searchPh: "Search by name, mood, keyword… e.g. warm / editorial / dark",
      kindAll: "All", kindPreset: "Presets", kindBold: "Library",
      kindNote: "Presets = a one-line layout hint + palette/font (lightweight) · Library = a full design-system doc with components, type scale and decorative detail (richer, generation follows it more closely)",
      empty: "No matching styles — try another keyword",
      selLabel: "Selected", copy: "Copy name", copied: "Copied ✓",
      copyManual: "Press ⌘/Ctrl+C", badgePreset: "PRESET", badgeLibrary: "LIBRARY",
    },
    zh: {
      intro: "当前可用的全部配色 + 字体速览卡片——这不是版式预览，真正的排版细节要看到生成结果才会体现。挑一个喜欢的，把名字告诉助手，就用它来生成。",
      countUnit: "个风格",
      searchPh: "按名字、气质、关键词搜索…比如 温暖 / 编辑风 / 深色",
      kindAll: "全部", kindPreset: "精选预设", kindBold: "模板库",
      kindNote: "精选预设 = 一句话版式提示 + 配色/字体（轻量） · 模板库 = 完整设计系统文档，含具体组件、字号阶梯、装饰细节（更详尽，生成效果更贴合）",
      empty: "没有匹配的风格 — 试试换个关键词",
      selLabel: "已选", copy: "复制名称", copied: "已复制 ✓",
      copyManual: "请手动按 ⌘/Ctrl+C", badgePreset: "预设", badgeLibrary: "模板库",
    },
  };

  const MOOD_ZH = {
    "activist":"行动主义","approachable":"亲和","archival":"档案感","artistic":"艺术",
    "atmospheric":"氛围感","bauhaus":"包豪斯","bold":"大胆","calm":"沉稳",
    "cheerful":"欢快","clean":"干净","confident":"自信","considered":"考究",
    "crafted":"匠心","creative":"创意","cultural-institution":"文化机构",
    "cyberpunk":"赛博朋克","design-led":"设计主导","design-research":"设计研究",
    "developer-focused":"开发者向","dramatic":"戏剧感","earthy":"大地气息",
    "editorial":"编辑风","electric":"电光","elegant":"优雅","energetic":"活力",
    "expressive":"表现力","fresh":"清新","friendly":"友好","fun":"有趣",
    "futuristic":"未来感","geeky":"极客","graphic":"图形感","hacker":"黑客",
    "handmade":"手作","high-contrast":"高对比","high-impact":"冲击力",
    "honest":"朴实","hospitality":"款待感","indie":"独立","institutional":"机构感",
    "intellectual":"知性","intentional":"用心","intimate":"亲密",
    "kawaii-tech":"萌系科技","ledger":"账本风","literary":"文学","lo-fi":"低保真",
    "loud":"张扬","luxe":"奢华","magazine-cover":"杂志封面",
    "messy-on-purpose":"刻意凌乱","mid-century":"中古现代","modern":"现代",
    "modernist":"现代主义","monochrome":"单色","moody":"暗调情绪","natural":"自然",
    "newspaper":"报纸风","nocturnal":"夜色","nostalgic":"怀旧","organic":"有机",
    "organized":"有序","personality-driven":"个性鲜明","playful":"俏皮",
    "poster-like":"海报感","precise":"精准","premium":"高级",
    "product-catalogue":"产品目录","professional":"专业","punchy":"干脆有力",
    "quiet":"安静","raw":"粗粝","restrained":"克制","retro":"复古",
    "retro-modern":"复古现代","retro-tech":"复古科技","scholarly":"学术",
    "small-batch":"小批量","social":"社交","sophisticated":"老练",
    "structural":"结构感","studious":"书卷","sunny":"明媚","tactile":"质感",
    "tech-print":"科技印刷","technical":"技术流","techy":"科技感",
    "thoughtful":"深思","trustworthy":"可信赖","underground":"地下",
    "warm":"温暖","warm-classical":"暖调古典","warm-minimal":"暖调极简",
    "warm-modern":"暖调现代","warm-retro":"暖调复古","weighty":"厚重",
    "wholesome":"治愈","witty":"机智","workshop":"工坊",
  };
  const FORMALITY_ZH = {
    "high":"正式","medium-high":"偏正式","medium":"中等",
    "medium-low":"偏随性","low":"随性",
  };
  const SCHEME_ZH = { "light":"浅色","dark":"深色","mixed":"明暗混合" };

  const zhMood = m => MOOD_ZH[m] || m;

  // default language follows the browser; the toggle persists the choice
  let lang;
  try { lang = localStorage.getItem('gallery-lang'); } catch(e) { lang = null; }
  if (lang !== 'en' && lang !== 'zh') {
    lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  }

  const langToggle = document.getElementById('langToggle');
  langToggle.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      try { localStorage.setItem('gallery-lang', lang); } catch(e) {}
      applyLang();
    });
  });

  function applyLang(){
    const t = I18N[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    langToggle.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === lang));
    document.getElementById('introText').textContent = t.intro;
    document.getElementById('countUnit').textContent = t.countUnit;
    searchInput.placeholder = t.searchPh;
    kindToggle.querySelector('[data-kind="all"]').textContent = t.kindAll;
    kindToggle.querySelector('[data-kind="preset"]').textContent = t.kindPreset;
    kindToggle.querySelector('[data-kind="bold"]').textContent = t.kindBold;
    document.getElementById('kindNote').textContent = t.kindNote;
    document.getElementById('selLabel').textContent = t.selLabel;
    document.getElementById('copyBtn').textContent = t.copy;
    chipRow.querySelectorAll('.chip').forEach(c => {
      c.textContent = lang === 'zh' ? zhMood(c.dataset.mood) : c.dataset.mood;
    });
    render();
  }

  totalNum.textContent = data.length;

  // top mood tags by frequency across whatever data was actually generated,
  // so the filter chips stay relevant even as templates are added/removed
  const moodCounts = {};
  data.forEach(item => item.mood.forEach(m => { moodCounts[m] = (moodCounts[m]||0) + 1; }));
  const TOP_MOODS = Object.keys(moodCounts).sort((a,b) => moodCounts[b]-moodCounts[a]).slice(0,12);

  let activeKind = 'all';
  let activeMood = null;
  let selectedSlug = null;

  TOP_MOODS.forEach(m => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = m;
    chip.dataset.mood = m;
    chip.addEventListener('click', () => {
      activeMood = activeMood === m ? null : m;
      render();
    });
    chipRow.appendChild(chip);
  });

  kindToggle.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeKind = btn.dataset.kind;
      kindToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  searchInput.addEventListener('input', render);

  function textColorFor(hex){
    const c = hex.replace('#','');
    if (c.length < 6) return '#111';
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    return lum > 0.6 ? '#141414' : '#F5F2E8';
  }

  function cardHTML(item){
    const zh = lang === 'zh';
    const bg = item.colors[0] || '#cccccc';
    const textColor = textColorFor(bg);
    const swatches = item.colors.slice(0,5).map(c => `<span style="background:${c}"></span>`).join('');
    const pills = item.mood.slice(0,3)
      .map(m => `<span class="pill">${zh ? zhMood(m) : m}</span>`).join('');
    const extraPills = [
        zh ? FORMALITY_ZH[item.formality] || item.formality : item.formality,
        zh ? SCHEME_ZH[item.scheme] || item.scheme : item.scheme,
      ].filter(Boolean).map(v => `<span class="pill">${v}</span>`).join('');
    const kindLabel = item.kind === 'preset' ? I18N[lang].badgePreset : I18N[lang].badgeLibrary;
    const kindBg = item.kind === 'preset' ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.18)';
    const tagline = zh ? (item.tagline_zh || item.tagline) : item.tagline;
    return `
      <article class="card" data-slug="${item.slug}" tabindex="0" role="button" aria-pressed="false">
        <div class="plate" style="background:${bg};color:${textColor};">
          <span class="check">✓</span>
          <span class="kind-badge" style="background:${kindBg};color:${textColor};">${kindLabel}</span>
          <div class="name" style="font-family:'${item.font}', var(--font-display);">${item.name}</div>
        </div>
        <div class="swatches">${swatches}</div>
        <div class="body">
          <p class="tagline">${tagline}</p>
          <div class="meta">${pills}${extraPills}</div>
        </div>
      </article>`;
  }

  function render(){
    chipRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.mood === activeMood));
    const q = searchInput.value.trim().toLowerCase();
    const filtered = data.filter(item => {
      if (activeKind !== 'all' && item.kind !== activeKind) return false;
      if (activeMood && !item.mood.includes(activeMood)) return false;
      if (q){
        // search across BOTH languages regardless of display language, so
        // "warm" and "温暖" both find the same cards
        const zhMoods = item.mood.map(zhMood).join(' ');
        const hay = (item.name + ' ' + item.tagline + ' ' + (item.tagline_zh||'') + ' '
          + item.mood.join(' ') + ' ' + zhMoods + ' '
          + (item.scheme||'') + ' ' + (SCHEME_ZH[item.scheme]||'') + ' '
          + (item.formality||'') + ' ' + (FORMALITY_ZH[item.formality]||'')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    countNum.textContent = filtered.length;
    grid.innerHTML = filtered.length
      ? filtered.map(cardHTML).join('')
      : `<div class="empty">${I18N[lang].empty}</div>`;

    grid.querySelectorAll('.card').forEach(card => {
      card.classList.toggle('selected', card.dataset.slug === selectedSlug);
      card.setAttribute('aria-pressed', card.dataset.slug === selectedSlug ? 'true' : 'false');
      const activate = () => selectCard(card.dataset.slug);
      card.addEventListener('click', activate);
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); } });
    });
  }

  function selectCard(slug){
    selectedSlug = selectedSlug === slug ? null : slug;
    const item = data.find(d => d.slug === slug);
    grid.querySelectorAll('.card').forEach(c => {
      const isSel = c.dataset.slug === selectedSlug;
      c.classList.toggle('selected', isSel);
      c.setAttribute('aria-pressed', isSel ? 'true' : 'false');
    });
    if (selectedSlug && item){
      selNameInput.value = item.name;
      selbar.classList.add('show');
      // auto-select the text so a manual Cmd/Ctrl+C always works even if
      // every scripted copy method below is blocked by iframe permissions
      requestAnimationFrame(() => { selNameInput.focus(); selNameInput.select(); });
    } else {
      selbar.classList.remove('show');
    }
  }

  document.getElementById('dismissBtn').addEventListener('click', () => selectCard(selectedSlug));

  // Artifacts render inside a sandboxed iframe, where the async Clipboard API
  // is frequently blocked by the parent's Permissions-Policy (no clipboard-write
  // delegated). navigator.clipboard.writeText() then silently rejects — so we
  // verify success before claiming it, and always fall back to the legacy
  // execCommand('copy') path, and finally to "just select the text for the user".
  async function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      try { await navigator.clipboard.writeText(text); return true; } catch(e) { /* fall through */ }
    }
    try {
      selNameInput.focus();
      selNameInput.select();
      const ok = document.execCommand('copy');
      if (ok) return true;
    } catch(e) { /* fall through */ }
    return false;
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!selectedSlug) return;
    const item = data.find(d => d.slug === selectedSlug);
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    const ok = await copyText(item.name);
    if (ok){
      btn.textContent = I18N[lang].copied;
    } else {
      // scripted copy genuinely failed (common in sandboxed iframes) — the
      // name is already selected in the input above, so tell the user to
      // use their own keyboard shortcut instead of pretending it worked
      selNameInput.focus();
      selNameInput.select();
      btn.textContent = I18N[lang].copyManual;
    }
    setTimeout(() => btn.textContent = original, 1600);
  });

  applyLang();
})();
</script>
